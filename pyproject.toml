[project]
name = "reviewlens"
version = "1.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF100"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real analysis service (needs OPENAI_API_KEY)"]
addopts = "-m 'not live'"
