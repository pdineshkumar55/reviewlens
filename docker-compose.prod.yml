services:
  reviewlens:
    build: .
    container_name: reviewlens
    env_file: .env
    ports:
      - "127.0.0.1:8611:8501"
    volumes:
      - reviewlens-cache:/app/.cache
      - reviewlens-logs:/app/logs
    restart: unless-stopped
    labels:
      # Routed by the host's Traefik (docker provider); WebSockets pass through by default.
      - traefik.enable=true
      - traefik.http.routers.reviewlens.rule=Host(`reviewlens.dinesh-genai.tech`)
      - traefik.http.routers.reviewlens.entrypoints=websecure
      - traefik.http.routers.reviewlens.tls.certresolver=letsencrypt
      - traefik.http.routers.reviewlens.service=reviewlens
      - traefik.http.services.reviewlens.loadbalancer.server.port=8501
    mem_limit: 768m
    cpus: 1.0

volumes:
  reviewlens-cache:
  reviewlens-logs:
